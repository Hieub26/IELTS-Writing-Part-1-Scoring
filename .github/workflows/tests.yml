name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ielts-grader-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ielts-grader-agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch keeps the install small; the tests mock the NLI model.
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m spacy download en_core_web_sm

      # Gemini, the NLI model and LanguageTool are mocked, so the suite needs
      # no API key, model download or Java runtime.
      - name: Run tests
        run: python -m pytest -q
